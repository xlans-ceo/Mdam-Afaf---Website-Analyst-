name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck / Lint
      run: npm run lint

    - name: Run Test Suite
      run: npm test

    - name: Check Client Bundle (No Leaks)
      run: npm run check:bundle

    - name: Config Check
      run: npm run config:check

    - name: Preflight Check
      run: npm run preflight
